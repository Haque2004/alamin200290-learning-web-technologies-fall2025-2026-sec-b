<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Degree Form</title>
</head>
<body>
    <h3>5. Degree</h3>
    <form onsubmit="return validateDegree()">
        <label><input type="checkbox" name="degree" value="SSC"> SSC</label>
        <label><input type="checkbox" name="degree" value="HSC"> HSC</label>
        <label><input type="checkbox" name="degree" value="BSc"> BSc</label>
        <div id="degreeError" aria-live="polite" style="color:red; margin-top:8px;"></div>
        <br><br>
        <input type="submit" value="Submit">
    </form>

    <script>
        function validateDegree() {
            const checkboxes = document.getElementsByName('degree');
            let isChecked = false;
            for (let i = 0; i < checkboxes.length; i++) {
                if (checkboxes[i].checked) {
                    isChecked = true;
                    break;
                }
            }
            const errorMsg = document.getElementById('degreeError');
            if (!isChecked) {
                errorMsg.textContent = 'Please select at least one degree!';
                return false; 
            }
            errorMsg.textContent = '';
            return true; 
        }
    </script>
</body>
</html>
